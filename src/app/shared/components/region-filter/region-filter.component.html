<div class="region-filter">
  <label for="region-select" class="region-label">Región:</label>
  <select
    id="region-select"
    class="region-select"
    [ngModel]="selectedRegion()"
    (ngModelChange)="onSelect($event)"
    aria-label="Seleccionar región"
  >
    <option 
      *ngFor="let region of regions" 
      [value]="region"
      [attr.aria-selected]="selectedRegion() === region"
    >
      {{ region === 'all' ? 'Todas las regiones' : region }}
    </option>
  </select>
</div>
