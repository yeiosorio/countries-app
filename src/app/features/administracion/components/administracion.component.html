<div class="container mx-auto p-4">
  <h1 class="text-2xl font-bold mb-4">Administración de Países</h1>
  <!-- Aquí irá el contenido de administración -->
</div>

<div class="favorites-container">
  <header class="favorites-header">
    <h1>Mis Países Favoritos</h1>
    <div class="favorites-count">
      {{ favoritesCount() }} países guardados
    </div>
  </header>

  @if (favoritesCount() === 0) {
    <div class="empty-state">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
      </svg>
      <h2>No tienes países favoritos</h2>
      <p>Explora la lista de países y marca tus favoritos para verlos aquí</p>
      <a routerLink="/listado" class="explore-button">
        Explorar Países
      </a>
    </div>
  } @else {
    <div class="favorites-grid">
      @for (country of favorites(); track country.cca3) {
        <app-country-card [country]="country"></app-country-card>
      }
    </div>
  }
</div>
